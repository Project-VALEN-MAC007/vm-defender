map $remote_addr $adaptive_profile {
    include /etc/nginx/maps/redirect_map.conf;
}

map $adaptive_profile $adaptive_backend {
    default     http://10.10.10.3:8080;
    real        http://10.10.10.3:8080;
    wordpress   http://10.10.10.2:8081;
    phpmyadmin  http://10.10.10.2:8082;
}

server {
    listen 192.168.56.10:80;
    server_name defender.lab;
    access_log /var/log/nginx/adaptive_access.log;

    return 308 https://$host$request_uri;
}

server {
    listen 192.168.56.10:443 ssl;
    server_name defender.lab;
    ssl_certificate /etc/adaptive-defender/tls/defender.lab.crt;
    ssl_certificate_key /etc/adaptive-defender/tls/defender.lab.key;
    access_log /var/log/nginx/adaptive_access.log;

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        proxy_intercept_errors on;
        error_page 502 503 504 = @backend_unavailable;
        proxy_pass $adaptive_backend;
    }

    location @backend_unavailable {
        default_type text/plain;
        add_header Cache-Control no-store always;
        return 503 "backend_unavailable profile=$adaptive_profile\n";
    }
}
