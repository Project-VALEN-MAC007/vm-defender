# Install as /etc/systemd/system/suricata.service.d/20-https-inspection.conf
# Bare --af-packet reads both trap-out and lo from suricata.yaml.
# A single runmode cannot capture multiple devices. Set threads: 1 on each
# af-packet entry to keep the lab to two capture/detection workers.
[Service]
ExecStart=
ExecStart=/usr/bin/suricata -c /etc/suricata/suricata.yaml --af-packet --runmode=workers
